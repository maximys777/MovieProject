<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноТренды</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-logo">Кино<span>Тренды</span></a>
    <div class="nav-links">
        <a href="index.html" style="color: var(--primary-color); font-weight: bold;">Главная</a>
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">EN</option>
            <option value="ru" selected>RU</option>
            <option value="uk">UK</option>
        </select>
        <a href="profile.html" class="profile-link">
            <img src="https://ui-avatars.com/api/?name=User&background=e50914&color=fff" alt="Аватар" class="avatar">
        </a>
    </div>
</nav>

<div class="content-wrapper">
    <div class="trending-section">
        <div class="section-header">
            <h2>Тренды</h2>
            <div class="controls">
                <div class="media-toggle">
                    <button id="type-movies" onclick="updateMediaType('movies')" class="active">Фильмы</button>
                    <button id="type-tv" onclick="updateMediaType('tv-shows')">Сериалы</button>
                </div>

                <button id="btn-day" onclick="updateTimeWindow('day', 'btn-day')" class="active">Сегодня</button>
                <button id="btn-week" onclick="updateTimeWindow('week', 'btn-week')">За неделю</button>
            </div>
        </div>
        <button id="prevBtn" class="slider-nav prev-slide" onclick="scrollSlider(-450)">&#10094;</button>
        <div class="slider-container" id="trending-slider"></div>
        <button id="nextBtn" class="slider-nav next-slide" onclick="scrollSlider(450)">&#10095;</button>
    </div>

    <div class="section-header">
        <h2 id="catalog-title">Каталог фильмов</h2>
    </div>

    <div id="movies-grid"></div>
    <div id="load-status" class="loading-status">Подождите, загрузка...</div>
</div>

<div id="movie-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 650px;">
        <div class="modal-body">

            <div class="modal-header-info">
                <div style="position: relative; flex-shrink: 0;">
                    <img id="movie-modal-poster" src="" alt="Постер">
                    <div id="movie-modal-rating" class="modal-rating-badge">★ 0.0</div>
                </div>
                <div class="modal-details">
                    <h2 id="movie-modal-title">Название фильма</h2>
                    <div class="modal-tags">
                        <span id="movie-modal-year">...</span>
                        <span id="movie-modal-country">...</span>
                        <span id="movie-modal-runtime">...</span>
                    </div>
                    <div id="movie-modal-genres" class="modal-genres"></div>
                </div>
            </div>

            <div class="modal-movie-overview">
                <h3 style="margin-bottom: 10px; font-size: 18px; color: white;">Про фільм</h3>
                <div class="overview-wrapper">
                    <p id="movie-modal-overview" class="modal-overview-text collapsed">Опис...</p>
                    <button id="movie-read-more" class="btn-read-more"
                            onclick="toggleOverview('movie-modal-overview', this)">Читати далі
                    </button>
                </div>
            </div>

        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeMovieModal()">Скасувати</button>
            <button class="btn-save" onclick="saveMovieToWatchlist()">Додати до списку</button>
        </div>
    </div>
</div>

<div id="tv-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-body">
            <div class="modal-header-info">
                <img id="modal-poster" src="" alt="Постер">
                <div class="modal-details">
                    <h2 id="modal-title">Название сериала</h2>
                    <div class="modal-tags">
                        <span id="modal-year">Рік: ...</span>
                        <span id="modal-country">Країна: ...</span>
                        <span id="modal-seasons-count">Усього сезонів: ...</span>
                    </div>
                    <p id="modal-overview" class="modal-description">Опис...</p>
                </div>
            </div>

            <div class="modal-progress-section">
                <div class="progress-header">
                    <h3>Відмітити переглянуте</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="check-all-season" onchange="toggleAllEpisodes(this)"> Обрати весь
                        сезон
                    </label>
                </div>
                <div id="season-tabs" class="season-tabs"></div>
                <div id="episodes-grid" class="episodes-grid"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
            <button class="btn-save" onclick="saveTvShowProgress()">Зберегти</button>
        </div>
    </div>
</div>

<div id="custom-toast" class="toast-notification">Успешно!</div>

<script src="/js/main.js"></script>

</body>
</html>
