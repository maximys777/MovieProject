<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page-title-home">MovieTracker</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/translations.js"></script>
    <script src="/js/i18n.js"></script>
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-logo">Movie<span>Tracker</span></a>

    <div class="nav-links">
        <a href="index.html" style="color: var(--primary-color); font-weight: bold;" data-i18n="nav-home">Home</a>

        <div class="search-container">
            <input type="text" id="search-input" class="search-input" data-i18n="search-placeholder" placeholder="Search movies and TV shows..." autocomplete="off">
            <div id="search-spinner" class="search-spinner hidden"></div>

            <div id="search-dropdown" class="search-dropdown hidden">
                <div id="search-results"></div>
                <button id="btn-view-all-search" class="btn-view-all-search hidden" data-action="search-all" data-i18n="btn-all-results">
                    View all results
                </button>
            </div>
        </div>

        <select id="langSelect" class="lang-select">
            <option value="en">EN</option>
            <option value="ru">RU</option>
            <option value="uk">UK</option>
        </select>
        <a href="profile.html" class="profile-link">
            <img src="https://ui-avatars.com/api/?name=User&background=e50914&color=fff" alt="Avatar" data-i18n="alt-avatar" data-i18n-attr="alt" class="avatar">
        </a>
    </div>
</nav>

<div class="content-wrapper">
    <div class="trending-section">
        <div class="section-header">
            <h2 data-i18n="trending-title">Trending</h2>
            <div class="controls">
                <div class="media-toggle">
                    <button id="type-movies" class="active" data-action="set-media-type" data-media-type="movies" data-i18n="type-movies">Movies</button>
                    <button id="type-tv" data-action="set-media-type" data-media-type="tv-shows" data-i18n="type-tv">TV Shows</button>
                </div>

                <button id="btn-day" class="active" data-action="set-time-window" data-time-window="day" data-i18n="btn-today">Today</button>
                <button id="btn-week" data-action="set-time-window" data-time-window="week" data-i18n="btn-week">This week</button>
            </div>
        </div>
        <button id="prevBtn" class="slider-nav prev-slide" data-action="scroll-slider" data-slider="trending-slider" data-distance="-450">&#10094;</button>
        <div class="slider-container" id="trending-slider"></div>
        <button id="nextBtn" class="slider-nav next-slide" data-action="scroll-slider" data-slider="trending-slider" data-distance="450">&#10095;</button>
    </div>

    <div class="section-header">
        <h2 id="catalog-title" data-i18n="catalog-movies">Movie Catalog</h2>
    </div>

    <div id="movies-grid"></div>
    <div id="load-status" class="loading-status" data-i18n="loading">Loading...</div>
</div>

<div id="movie-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 650px;">
        <div class="modal-body">
            <div class="modal-header-info">
                <div style="position: relative; flex-shrink: 0;">
                    <img id="movie-modal-poster" src="" alt="Poster" data-i18n="alt-poster" data-i18n-attr="alt">
                    <div id="movie-modal-rating" class="modal-rating-badge">★ 0.0</div>
                </div>
                <div class="modal-details">
                    <h2 id="movie-modal-title">...</h2>
                    <div class="modal-tags">
                        <span id="movie-modal-year">...</span>
                        <span id="movie-modal-country">...</span>
                        <span id="movie-modal-runtime">...</span>
                    </div>
                    <div id="movie-modal-genres" class="modal-genres"></div>
                </div>
            </div>

            <div class="modal-movie-overview">
                <h3 style="margin-bottom: 10px; font-size: 18px; color: white;" data-i18n="modal-about">About movie</h3>
                <div class="overview-wrapper">
                    <p id="movie-modal-overview" class="modal-overview-text collapsed">...</p>
                    <button id="movie-read-more" class="btn-read-more" data-i18n="modal-read-more"
                            data-action="toggle-overview" data-target="movie-modal-overview">Read more
                    </button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" data-action="close-movie-modal" data-i18n="modal-cancel">Cancel</button>
            <button class="btn-save" data-action="save-movie" data-i18n="modal-save">Add to watchlist</button>
        </div>
    </div>
</div>

<div id="tv-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-body">
            <div class="modal-header-info">
                <img id="modal-poster" src="" alt="Poster" data-i18n="alt-poster" data-i18n-attr="alt">
                <div class="modal-details">
                    <h2 id="modal-title">...</h2>
                    <div class="modal-tags">
                        <span id="modal-year">...</span>
                        <span id="modal-country">...</span>
                        <span id="modal-seasons-count">...</span>
                    </div>
                    <div id="tv-modal-genres" class="modal-genres"></div>
                    <p id="modal-overview" class="modal-description">...</p>
                </div>
            </div>

            <div class="modal-progress-section">
                <div class="progress-header">
                    <h3 data-i18n="modal-episodes">Mark watched</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="check-all-season" data-action="toggle-all-episodes">
                        <span data-i18n="modal-all-season">Select all season</span>
                    </label>
                </div>
                <div id="season-tabs" class="season-tabs"></div>
                <div id="episodes-grid" class="episodes-grid"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" data-action="close-modal" data-target="tv-modal" data-i18n="modal-cancel">Cancel</button>
            <button class="btn-save" data-action="save-tv" data-i18n="modal-save">Add to watchlist</button>
        </div>
    </div>
</div>

<div id="custom-toast" class="toast-notification">...</div>

<script src="/js/main.js"></script>

</body>
</html>
