databaseChangeLog:
  - changeSet:
      id: create-user-table
      author: maximys777
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_name
                  type: varchar(255)
              - column:
                  name: google_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: profile_picture_url
                  type: varchar(255)
